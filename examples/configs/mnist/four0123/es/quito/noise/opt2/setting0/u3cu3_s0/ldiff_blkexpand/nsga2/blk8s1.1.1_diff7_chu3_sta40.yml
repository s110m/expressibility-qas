# Pure-quantum NSGA-II block/share parameters. Content-identical to
# ../../hybrid_full/nsga2/blk8s1.1.1.yml and to the pure M1/M2 leaves; the name
# matches the pure-quantum M1 leaf (blk8s1.1.1_diff7_chu3_sta40.yml) so all three
# methods are launched from identically-named leaves and the es_runs directory
# names line up.
#
# These four keys must be repeated in every leaf: torchpack's recursive config load
# merges only ancestor default.yml files, never sibling leaves.
model:
  arch:
    n_blocks: 8
    n_front_share_blocks: 1
    n_front_share_wires: 1
    n_front_share_ops: 1
